<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lumio</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup">
    <div class="popup-header">
      <h1>Lumio</h1>
      <span class="version">v1.0</span>
    </div>

    <div class="popup-status" id="status">
      <div class="status-dot" id="status-dot"></div>
      <span id="status-text">检查配置中...</span>
    </div>

    <div class="popup-actions">
      <button class="popup-btn primary" id="btn-open-panel">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
        </svg>
        打开 AI 对话面板
      </button>
      <button class="popup-btn" id="btn-summarize">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
          <polyline points="14 2 14 8 20 8"/>
          <line x1="16" y1="13" x2="8" y2="13"/>
          <line x1="16" y1="17" x2="8" y2="17"/>
        </svg>
        总结当前页面
      </button>
      <button class="popup-btn" id="btn-translate">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M5 8l6 6M4 14l6-6 2-3M2 5h12M7 2h1M22 22l-5-10-5 10M14 18h6"/>
        </svg>
        翻译当前页面
      </button>
    </div>

    <div class="popup-settings">
      <div class="setting-row">
        <label>API 地址</label>
        <input type="text" id="apiurl-input" placeholder="例如: https://api.deepseek.com">
      </div>
      <div class="setting-row">
        <label>Token</label>
        <input type="password" id="token-input" placeholder="输入你的 Token">
      </div>
      <div class="setting-row">
        <label>模型 (可选)</label>
        <input type="text" id="model-input" placeholder="例如: deepseek-chat、gpt-4o">
      </div>
      <button class="popup-btn save" id="btn-save">保存</button>
    </div>

    <div class="popup-footer">
      <div class="shortcuts">
        <span class="shortcut"><kbd>⌘⇧Y</kbd> 打开面板</span>
        <span class="shortcut"><kbd>⌘⇧T</kbd> 翻译选中</span>
      </div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
