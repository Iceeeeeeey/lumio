<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lumio</title>
  <link rel="stylesheet" href="sidepanel.css">
</head>
<body>
  <!-- Header -->
  <div class="header">
    <div class="header-left">
      <h1>Lumio</h1>
    </div>
    <div class="header-actions">
      <button id="btn-summary" class="header-btn" title="总结当前页面">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
          <polyline points="14 2 14 8 20 8"/>
          <line x1="16" y1="13" x2="8" y2="13"/>
          <line x1="16" y1="17" x2="8" y2="17"/>
          <line x1="10" y1="9" x2="8" y2="9"/>
        </svg>
      </button>
      <button id="btn-new-chat" class="header-btn" title="新建对话">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="12" y1="5" x2="12" y2="19"/>
          <line x1="5" y1="12" x2="19" y2="12"/>
        </svg>
      </button>
      <button id="btn-history" class="header-btn" title="对话历史">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"/>
          <polyline points="12 6 12 12 16 14"/>
        </svg>
      </button>
      <button id="btn-settings" class="header-btn" title="设置">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="3"/>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
        </svg>
      </button>
    </div>
  </div>

  <!-- Quick Actions Bar -->
  <div class="quick-actions">
    <button class="quick-btn" data-action="SUMMARIZE_PAGE">📄 总结页面</button>
    <button class="quick-btn" data-action="KEY_POINTS">🔑 提取要点</button>
    <button class="quick-btn" data-action="TRANSLATE_PAGE">🌐 翻译页面</button>
    <button class="quick-btn" data-action="GLOSSARY">📚 术语表</button>
  </div>

  <!-- Chat Messages Area -->
  <div id="chat-container" class="chat-container">
    <div id="messages" class="messages">
      <div class="welcome-message">
        <div class="welcome-icon">📖</div>
        <h2>Lumio</h2>
        <p>照亮你的阅读之路</p>
        <div class="welcome-tips">
          <div class="tip">💡 选中网页文本，使用浮动工具栏快速翻译或解释</div>
          <div class="tip">💡 点击上方按钮总结当前页面内容</div>
          <div class="tip">💡 代码块会显示「解释代码」按钮</div>
          <div class="tip">💡 快捷键 <kbd>Cmd+Shift+Y</kbd> 打开面板</div>
        </div>
      </div>
    </div>
  </div>

  <!-- Quote Preview -->
  <div id="quote-preview" class="quote-preview" style="display: none;">
    <div class="quote-header">
      <span>📌 引用内容</span>
      <button id="quote-remove" class="quote-remove">✕</button>
    </div>
    <div id="quote-text" class="quote-text"></div>
    <div id="quote-actions" class="quote-actions">
      <button class="quote-action-btn" data-action="TRANSLATE">翻译</button>
      <button class="quote-action-btn" data-action="EXPLAIN">解释</button>
      <button class="quote-action-btn" data-action="EXPLAIN_CODE">解释代码</button>
    </div>
  </div>

  <!-- Input Area -->
  <div class="input-area">
    <div class="input-wrapper">
      <textarea id="chat-input" placeholder="输入问题，或选中网页文字后引用到这里..." rows="1"></textarea>
      <button id="btn-send" class="send-btn" title="发送 (Enter)">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
          <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
        </svg>
      </button>
    </div>
    <div class="input-hint">Enter 发送 · Shift+Enter 换行 · 选中文本可直接引用</div>
  </div>

  <!-- Settings Panel (overlay) -->
  <div id="settings-panel" class="settings-panel" style="display: none;">
    <div class="settings-header">
      <h2>设置</h2>
      <button id="settings-close" class="settings-close">✕</button>
    </div>
    <div class="settings-body">
      <div class="setting-group">
        <label>API 地址</label>
        <input type="text" id="setting-apiurl" placeholder="https://your-api.com/v1/chat/completions">
        <div class="setting-hint">填写完整的接口地址，通常以 /v1/chat/completions 结尾</div>
      </div>
      <div class="setting-group">
        <label>Token</label>
        <input type="password" id="setting-token" placeholder="输入你的 Token">
      </div>
      <div class="setting-group">
        <label>模型 (可选)</label>
        <input type="text" id="setting-model" placeholder="留空使用服务商默认模型">
        <div class="setting-hint">例如: gpt-4o、claude-3.5-sonnet、deepseek-chat</div>
      </div>
      <div class="setting-group">
        <label>回复语言</label>
        <select id="setting-language">
          <option value="zh-CN">简体中文</option>
          <option value="zh-TW">繁體中文</option>
          <option value="en">English</option>
          <option value="ja">日本語</option>
          <option value="ko">한국어</option>
        </select>
      </div>
      <button id="settings-save" class="settings-save-btn">保存设置</button>
    </div>
  </div>

  <!-- History Panel (overlay) -->
  <div id="history-panel" class="history-panel" style="display: none;">
    <div class="settings-header">
      <h2>对话历史</h2>
      <button id="history-close" class="settings-close">✕</button>
    </div>
    <div id="history-list" class="history-list">
      <div class="history-empty">暂无对话历史</div>
    </div>
  </div>

  <script src="sidepanel.js"></script>
</body>
</html>
